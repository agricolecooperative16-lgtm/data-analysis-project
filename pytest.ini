# pytest.ini

[pytest]
# مسارات البحث عن الاختبارات
testpaths = tests

# إعدادات الاختبار
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# إضافات مفيدة
addopts = 
    -v
    --tb=short
    --strict-markers
    --maxfail=1
    --disable-warnings
    -p no:cacheprovider

# علامات (Markers) لتنظيم الاختبارات
markers =
    unit: اختبارات الوحدة للمكونات الفردية
    integration: اختبارات التكامل بين المكونات
    slow: اختبارات بطيئة (تحميل بيانات كبيرة، نماذج)
    data: اختبارات تعتمد على البيانات
    pipeline: اختبارات الـ pipeline الكامل
    cleaning: اختبارات تنظيف البيانات

# إعدادات البيئة
env =
    TESTING = true
    PYTHONHASHSEED = 42

# استبعاد بعض المجلدات
norecursedirs = .git .venv venv env data logs reports __pycache__