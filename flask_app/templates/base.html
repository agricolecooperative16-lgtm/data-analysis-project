<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}نظام تحليل المبيعات{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { 
            background: #f0f2f5; 
            min-height: 100vh;
        }
        .navbar { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            box-shadow: 0 2px 15px rgba(0,0,0,0.15);
            padding: 12px 0;
        }
        .navbar-brand { 
            font-weight: 800; 
            font-size: 1.5rem; 
        }
        .navbar-brand i {
            margin-left: 10px;
        }
        .nav-link { 
            color: rgba(255,255,255,0.85) !important; 
            font-weight: 600; 
            padding: 8px 16px !important;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .nav-link:hover { 
            color: white !important; 
            background: rgba(255,255,255,0.15);
        }
        .nav-link.active { 
            color: white !important; 
            background: rgba(255,255,255,0.2);
        }
        .card { 
            border: none; 
            border-radius: 15px; 
            box-shadow: 0 2px 15px rgba(0,0,0,0.08); 
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        .stat-card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            text-align: center;
            border: 1px solid #e9ecef;
            transition: all 0.3s;
        }
        .stat-card:hover {
            border-color: #667eea;
        }
        .stat-card .value { 
            font-size: 2rem; 
            font-weight: 700; 
            color: #2c3e50; 
        }
        .stat-card .label { 
            color: #7f8c8d; 
            font-size: 0.9rem; 
        }
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            border: none; 
            transition: all 0.3s;
        }
        .btn-primary:hover { 
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            transition: all 0.3s;
        }
        .btn-success:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            color: white;
            transition: all 0.3s;
        }
        .btn-warning:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
            color: white;
        }
        .section-title { 
            color: #2c3e50; 
            font-weight: 700; 
            margin-bottom: 20px; 
            border-right: 4px solid #667eea; 
            padding-right: 15px; 
        }
        .loading { 
            text-align: center; 
            padding: 50px; 
        }
        .loading .spinner { 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 
            100% { transform: rotate(360deg); } 
        }
        footer {
            border-top: 1px solid #e9ecef;
            margin-top: 40px;
        }
        .badge {
            padding: 6px 14px;
            font-weight: 600;
        }
        .table th {
            background: #f8f9fa;
            font-weight: 700;
            color: #2c3e50;
        }
        .progress {
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-chart-line"></i> تحليل المبيعات
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="fas fa-home"></i> الرئيسية
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">
                            <i class="fas fa-tachometer-alt"></i> لوحة التحكم
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/rfm' %}active{% endif %}" href="/rfm">
                            <i class="fas fa-users"></i> RFM
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/forecast' %}active{% endif %}" href="/forecast">
                            <i class="fas fa-chart-line"></i> التنبؤ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/seasonal' %}active{% endif %}" href="/seasonal">
                            <i class="fas fa-calendar-alt"></i> موسمي
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="text-center text-muted py-4 mt-4">
        <div class="container">
            <small>
                <i class="fas fa-code"></i> نظام تحليل المبيعات والعملاء 
                <span class="mx-2">•</span> 
                © 2026 جميع الحقوق محفوظة
            </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
